workflowExternalId: wf_icapi_data_pipeline
version: '5'
workflowDefinition:
  description: 'Work to execute the pipeline'
  tasks:
  - externalId: create_asset_hierarchy_task
    type: transformation
    parameters:
      transformation:
        externalId: tr-create_asset_hierarchy
    name: 'Task-create_asset_hierarchy'
    description: 'Task to create asset hierarchy'
    retries: 3
    timeout: 3600
    onFailure: abortWorkflow
  - externalId: oee_timeseries_task
    type: function
    parameters:
      function:
        externalId: oee_timeseries
    retries: 3
    timeout: 3600
    onFailure: abortWorkflow
    dependsOn:
      - externalId: icapi_datapoints_extractor_task
  - externalId: icapi_datapoints_extractor_task
    type: function
    parameters:
      function:
        externalId: icapi_datapoints_extractor
        data: { "hours": 1 }
    retries: 3
    timeout: 3600
    onFailure: abortWorkflow
    dependsOn:
      - externalId: contextualize_ts_assets_task
  - externalId: contextualize_ts_assets_task
    type: transformation
    parameters:
      transformation:
        externalId: contextualize_ts_assets
    name: 'Task-contextualize_ts_assets'
    description: 'Task to contextualize the time series and assets'
    retries: 3
    timeout: 3600
    onFailure: abortWorkflow
    dependsOn:
      - externalId: create_asset_hierarchy_task
